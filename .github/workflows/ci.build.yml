name: Build

on:
    pull_request:
    push:
        branches: [main, develop, refactor/rust-rewrite]

jobs:
    patches:
        name: Build Patches (Rust)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Read toolchain version
              id: toolchain
              run: echo "channel=$(grep 'channel' rust-toolchain.toml | cut -d'"' -f2)" >> $GITHUB_OUTPUT

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}
                  targets: thumbv7em-none-eabihf

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      patches/seed/blink
                      patches/seed/daisy
                      patches/pod/blink
                      patches/pod/lily
                      patches/pod/audio-test
                      patches/init/kudzu
                      patches/init/lotus

            - name: Build All Patches
              run: ./scripts/build.sh
